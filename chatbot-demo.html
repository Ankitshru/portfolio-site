<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Clinic — Patient Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 380px;
            height: 600px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .chat-header {
            background: #075e54;
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .clinic-avatar {
            width: 40px;
            height: 40px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .clinic-info h3 {
            font-size: 16px;
            font-weight: 500;
        }

        .clinic-info p {
            font-size: 12px;
            color: #dcf8c6;
        }

        .online-dot {
            width: 8px;
            height: 8px;
            background: #25d366;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        /* Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            background: #e5ddd5;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.5;
            position: relative;
        }

        .message.bot {
            background: white;
            align-self: flex-start;
            border-radius: 0 8px 8px 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message.user {
            background: #dcf8c6;
            align-self: flex-end;
            border-radius: 8px 0 8px 8px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .message-time {
            font-size: 10px;
            color: #999;
            text-align: right;
            margin-top: 4px;
        }

        .typing-indicator {
            background: white;
            align-self: flex-start;
            padding: 12px 16px;
            border-radius: 0 8px 8px 8px;
            display: none;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.2s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-6px); opacity: 1; }
        }

        /* Input */
        .chat-input {
            padding: 12px 16px;
            background: #f0f2f5;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 16px;
            border: none;
            border-radius: 24px;
            background: white;
            font-size: 14px;
            outline: none;
            font-family: 'Segoe UI', sans-serif;
        }

        .send-btn {
            width: 40px;
            height: 40px;
            background: #075e54;
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: background 0.2s;
        }

        .send-btn:hover { background: #128c7e; }
        .send-btn:disabled { background: #ccc; cursor: not-allowed; }

        /* Disclaimer */
        .disclaimer {
            text-align: center;
            font-size: 11px;
            color: #999;
            padding: 6px;
            background: #f0f2f5;
        }
    </style>
</head>
<body>

<div class="chat-container">
    
    <!-- Header -->
    <div class="chat-header">
        <div class="clinic-avatar">🏥</div>
        <div class="clinic-info">
            <h3>City Clinic Assistant</h3>
            <p><span class="online-dot"></span>Online — typically replies instantly</p>
        </div>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            👋 Welcome to City Clinic! I'm your virtual assistant. I can help you with:
            <br><br>
            • Booking appointments<br>
            • Doctor availability<br>
            • Clinic information<br>
            • General health queries
            <br><br>
            How can I help you today?
            <div class="message-time">Now</div>
        </div>
        
        <!-- Typing indicator -->
        <div class="typing-indicator" id="typingIndicator">
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <!-- Input -->
    <div class="chat-input">
        <input 
            type="text" 
            id="messageInput" 
            placeholder="Type a message..." 
            autocomplete="off"
        />
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>

    <div class="disclaimer">Powered by Autosys AI</div>
</div>

<script>
    // Configuration
    const WEBHOOK_URL = 'https://chafe-amiable-ancient.ngrok-free.dev/webhook/1aa85b7c-69e9-41f3-b0cb-924184e5bd58';
    const SESSION_ID = 'demo_' + Math.random().toString(36).substr(2, 9);

    const messagesContainer = document.getElementById('chatMessages');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingIndicator = document.getElementById('typingIndicator');

    // Send on Enter key
    messageInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    function getCurrentTime() {
        return new Date().toLocaleTimeString('en-IN', { 
            hour: '2-digit', 
            minute: '2-digit' 
        });
    }

    function addMessage(text, type) {
        // Remove typing indicator first
        typingIndicator.style.display = 'none';
        
        const message = document.createElement('div');
        message.className = `message ${type}`;
        message.innerHTML = `
            ${text.replace(/\n/g, '<br>')}
            <div class="message-time">${getCurrentTime()}</div>
        `;
        
        // Insert before typing indicator
        messagesContainer.insertBefore(message, typingIndicator);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function showTyping() {
        typingIndicator.style.display = 'block';
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        // Add user message
        addMessage(message, 'user');
        messageInput.value = '';
        sendBtn.disabled = true;

        // Show typing indicator
        showTyping();

        try {
            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'ngrok-skip-browser-warning': 'true'
                },
                body: JSON.stringify({
                    message: message,
                    sessionId: SESSION_ID
                })
            });

            const data = await response.json();
            addMessage(data.reply, 'bot');

        } catch (error) {
            addMessage('Sorry, I am having trouble connecting right now. Please try again.', 'bot');
        }

        sendBtn.disabled = false;
        messageInput.focus();
    }
</script>

</body>
</html>
